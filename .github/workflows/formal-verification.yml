name: formal-verification

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/index.js'
      - 'skills/recruit-board/**'
      - 'scripts/verify-state-machines.mjs'
      - 'verification/formal/**'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    paths:
      - 'lib/index.js'
      - 'skills/recruit-board/**'
      - 'scripts/verify-state-machines.mjs'
      - 'verification/formal/**'
      - '.github/workflows/formal-verification.yml'

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: node --test verification/formal/runner.test.mjs
      - run: node scripts/verify-state-machines.mjs
