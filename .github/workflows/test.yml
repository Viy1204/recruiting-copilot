name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是最早把 --test 位置参数当 glob 解析的 LTS（20 按路径解析，
        # "tests/*.test.mjs" 会找不到文件）；24 对齐开发机
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零依赖、无 lockfile，不需要 install
      - run: npm test
